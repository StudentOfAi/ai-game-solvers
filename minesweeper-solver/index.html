<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Minesweeper CSP Solver</title>
<style>html,body{height:100%;margin:0;background:#0b1020;color:#e6eefc;font-family:Inter,system-ui,sans-serif}#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;font-size:14px}.label{font-weight:600;margin-right:6px}#stage{text-align:center;color:#a7b2cc;font-size:13px;position:fixed;top:34px;left:0;right:0}.wrap{display:flex;justify-content:center;align-items:center;min-height:100%;flex-direction:column;padding-top:60px}.btn{background:#1a2547;color:#e6eefc;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;margin:4px}.btn:hover{filter:brightness(1.2)}</style></head>
<body><div id="hud"><div><span class="label">Move:</span><span id="move">0</span> <span class="label" style="margin-left:10px">Status:</span><span id="status">Ready</span></div><div>Minesweeper CSP</div></div><div id="stage">CSP + Probability Engine</div>
<div class="wrap"><canvas id="cv" width="320" height="320" style="border-radius:8px;background:#0d0d1a"></canvas><div><button class="btn" id="solve">SOLVE</button><button class="btn" id="new">NEW GAME</button></div></div>
<script>
const GRID=10,MINES=12,CELL=32;
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
const NUM={1:"#4488ff",2:"#44ff44",3:"#ff4444",4:"#ff44ff",5:"#ffff44",6:"#44ffff",7:"#ff8800",8:"#ffffff"};
let board,solver,moveCount=0,gameOver=false,autoTimer=null;
function Cell(r,c){return{isMine:false,isRevealed:false,isFlagged:false,adjacent:0,row:r,col:c};}
function genBoard(){board=[];for(let r=0;r<GRID;r++){board.push([]);for(let c=0;c<GRID;c++)board[r].push(Cell(r,c));}
let pos=[...Array(GRID*GRID).keys()];for(let i=pos.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pos[i],pos[j]]=[pos[j],pos[i]];}
for(let i=0;i<MINES;i++){let r=Math.floor(pos[i]/GRID),c=pos[i]%GRID;board[r][c].isMine=true;}
for(let r=0;r<GRID;r++)for(let c=0;c<GRID;c++){if(!board[r][c].isMine){let cnt=0;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;let nr=r+dr,nc=c+dc;if(nr>=0&&nr<GRID&&nc>=0&&nc<GRID&&board[nr][nc].isMine)cnt++;}board[r][c].adjacent=cnt;}}}
function getNeighbors(r,c){let n=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;let nr=r+dr,nc=c+dc;if(nr>=0&&nr<GRID&&nc>=0&&nc<GRID)n.push(board[nr][nc]);}return n;}
function reveal(r,c){let cell=board[r][c];if(cell.isFlagged||cell.isRevealed)return true;if(cell.isMine){cell.isRevealed=true;return false;}
cell.isRevealed=true;if(cell.adjacent===0){for(let n of getNeighbors(r,c)){if(!n.isRevealed&&!n.isFlagged)reveal(n.row,n.col);}}return true;}
function isWon(){for(let r=0;r<GRID;r++)for(let c=0;c<GRID;c++){if(!board[r][c].isMine&&!board[r][c].isRevealed)return false;}return true;}
function nextMove(){for(let r=0;r<GRID;r++)for(let c=0;c<GRID;c++){let cell=board[r][c];if(!cell.isRevealed||cell.adjacent===0)continue;
let n=getNeighbors(r,c);let flagged=n.filter(x=>x.isFlagged).length;let unrev=n.filter(x=>!x.isRevealed&&!x.isFlagged);
if(!unrev.length)continue;if(cell.adjacent===flagged)return[unrev[0].row,unrev[0].col,"reveal"];
if(cell.adjacent-flagged===unrev.length)return[unrev[0].row,unrev[0].col,"flag"];}
let bestP=1,best=null;for(let r=0;r<GRID;r++)for(let c=0;c<GRID;c++){let cell=board[r][c];if(cell.isRevealed||cell.isFlagged)continue;
let cs=[];for(let n of getNeighbors(r,c)){if(n.isRevealed&&n.adjacent>0){let f=getNeighbors(n.row,n.col).filter(x=>x.isFlagged).length;let u=getNeighbors(n.row,n.col).filter(x=>!x.isRevealed&&!x.isFlagged);if(u.length)cs.push((n.adjacent-f)/u.length);}}
let p=cs.length?Math.max(...cs):MINES/(GRID*GRID);if(p<bestP){bestP=p;best=[r,c];}}return best?[best[0],best[1],"reveal"]:null;}
function draw(hl){ctx.clearRect(0,0,cv.width,cv.height);for(let r=0;r<GRID;r++)for(let c=0;c<GRID;c++){let cell=board[r][c];
let x=c*CELL,y=r*CELL;ctx.fillStyle=hl&&hl[0]===r&&hl[1]===c?"#5a5a7a":cell.isFlagged?"#3a3a4a":!cell.isRevealed?"#3a3a4a":cell.isMine?"#ff4444":"#1a1a2a";
ctx.fillRect(x,y,CELL,CELL);ctx.strokeStyle="#2a2a3a";ctx.strokeRect(x,y,CELL,CELL);
if(cell.isFlagged){ctx.font="14px sans-serif";ctx.textAlign="center";ctx.fillText("🚩",x+16,y+20);}
if(cell.isRevealed&&!cell.isMine&&cell.adjacent>0){ctx.fillStyle=NUM[cell.adjacent]||"#fff";ctx.font="bold 14px monospace";ctx.textAlign="center";ctx.fillText(cell.adjacent,x+16,y+21);}
if(cell.isRevealed&&cell.isMine){ctx.font="14px sans-serif";ctx.fillText("💣",x+16,y+20);}}}
function step(){if(gameOver)return;let mv=nextMove();if(!mv){document.getElementById("status").textContent="Stuck";return;}
let[r,c,act]=mv;moveCount++;document.getElementById("move").textContent=moveCount;
if(act==="reveal"){if(!reveal(r,c)){gameOver=true;draw([r,c]);document.getElementById("status").textContent="💥 HIT MINE";return;}}
else{board[r][c].isFlagged=true;document.getElementById("status").textContent="⚑ Flagged ("+r+","+c+")";}
draw([r,c]);if(isWon()){gameOver=true;document.getElementById("status").textContent="✅ SOLVED in "+moveCount+" moves!";}}
function autoPlay(){step();if(!gameOver)autoTimer=setTimeout(autoPlay,200);}
function reset(){if(autoTimer)clearTimeout(autoTimer);genBoard();moveCount=0;gameOver=false;document.getElementById("move").textContent=0;document.getElementById("status").textContent="Solving...";draw();autoTimer=setTimeout(autoPlay,500);}
document.getElementById("solve").onclick=()=>{if(!gameOver&&!autoTimer)autoPlay();};
document.getElementById("new").onclick=reset;
genBoard();draw();setTimeout(autoPlay,500);
</script></body></html>
